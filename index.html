<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- EDIT: your name -->
  <title>Hok Limheng</title>
  <meta name="description" content="Hok Limheng — CV and contact">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #E9EEEA;
      --ink: #17201D;
      --muted: #58655F;
      --accent: #0E5C57;
      --line: #C5D0CA;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Schibsted Grotesk", system-ui, sans-serif;
      font-size: 1.125rem;
      line-height: 1.55;
      display: flex;
      align-items: center;
      padding: 2rem 1.5rem;
    }
    main { width: 100%; max-width: 44rem; margin: 0 auto; }
    h1 {
      font-weight: 800;
      font-size: clamp(3rem, 12vw, 6.5rem);
      line-height: 0.92;
      letter-spacing: -0.04em;
      margin-bottom: 1.5rem;
    }
    .role { font-size: 1.35rem; font-weight: 500; margin-bottom: 0.5rem; }
    .intro { color: var(--muted); max-width: 34rem; margin-bottom: 2.5rem; }
    .cv {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      padding: 0.85rem 1.6rem;
      border-radius: 6px;
    }
    .cv:hover { background: #0A4642; }
    nav {
      margin-top: 3rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 1.75rem;
    }
    nav a { color: var(--ink); text-decoration-color: var(--line); text-underline-offset: 4px; }
    nav a:hover { color: var(--accent); text-decoration-color: var(--accent); }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <!-- EDIT: name, role, and one or two lines about yourself -->
    <h1>Hok<br>Limheng</h1>
    <p class="role">Software Developer · Phnom Penh</p>
    <p class="intro">I build web products and AI tools. This page has my CV and the best ways to reach me.</p>

    <!-- Must match the PDF file name in your repo exactly -->
    <a class="cv" href="CV-HokLimheng.pdf" target="_blank" rel="noopener">View my CV (PDF)</a>
  </main>
</body>
</html>
